ct:focus-visible,input:focus-visible{outline:3px solid #d78b3a;outline-offset:2px}@media(max-width:620px){.view{grid-template-columns:1fr}.wrap{padding:12px 10px 40px}.pane{padding:7px}.toolbar{gap:8px}}
</style></head><body><main class="wrap"><a class="back" href="./index.html">返回小小畫家</a> <a class="printlink" href="./anime-print-v1844.html">A4 列印角色圖</a><h1>果燃很派・圖片品質對照</h1><p class="lead">逐組放大檢查原有彩色圖與黑白線稿。這裡可用疊合模式比較角色造型，或放大檢視輪廓。圖片保留原始檔案，不自動重畫，也不改動孩子的作品。</p><div class="toolbar"><label for="who">選擇角色</label><select id="who"></select><button type="button" id="previous">上一位</button><button type="button" id="next">下一位</button><label for="opacity">疊合線稿透明度 <output id="opacityValue">55%</output></label><input id="opacity" type="range" min="0" max="100" value="55" step="5"></div><section class="view" aria-label="角色圖片對照"><figure class="pane"><img id="outline" alt="角色黑白線稿"><figcaption>黑白線稿</figcaption></figure><figure class="pane"><img id="color" alt="角色彩色圖"><figcaption>彩色參考圖</figcaption></figure></section><section class="overlay-section" aria-label="疊合對照"><h2 class="overlay-title">疊合檢查・輪廓位置</h2><div class="overlay"><img id="overlayColor" alt="彩色底圖"><img id="overlayOutline" alt="疊合黑白線稿"></div><p class="help">滑桿可調整上方線稿透明度。原圖片姿勢相近，但部分細節可能不是逐像素吻合；疊合效果是輔助檢查，不代表圖片已經完全一致。</p></section><section class="metrics" id="metrics" aria-live="polite"></section><p class="help">邊距統計以圖片像素計算，使用黑白亮度門檻 185、彩色門檻 220；不等於實際印表機測試。角色名稱為外觀描述，非官方角色名稱。</p></main><script>
(()=>{'use strict';const items=[{"name": "蘋果特務", "marginOutline": 56, "marginColor": 55, "dark": "7.03"}, {"name": "紅蘿蔔爆破手", "marginOutline": 56, "marginColor": 56, "dark": "5.05"}, {"name": "香菇劍客", "marginOutline": 53, "marginColor": 53, "dark": "4.89"}, {"name": "玉米戰士", "marginOutline": 61, "marginColor": 60, "dark": "6.18"}, {"name": "辣椒廚師", "marginOutline": 55, "marginColor": 55, "dark": "5.17"}, {"name": "花朵魔法師", "marginOutline": 54, "marginColor": 54, "dark": "4.57"}];let index=0;const $=s=>document.querySelector(s);const sel=$('#who');items.forEach((it,i)=>{const op=document.createElement('option');op.value=String(i);op.textContent=it.name;sel.append(op)});function show(i){index=(i+items.length)%items.length;sel.value=String(index);const it=items[index];const base='./assets/guides-';const p='guoran'+String(index+1).padStart(2,'0')+'.png';for(const [id,type] of [['#outline','outline'],['#overlayOutline','outline'],['#color','color'],['#overlayColor','color']]){$(id).src=base+type+'-clean/'+p;$(id).alt=it.name+(type==='outline'?'黑白線稿':'彩色參考圖')};$('#metrics').textContent='圖片規格 800 × 600 px。黑白最小邊距 '+it.marginOutline+' px；彩色最小邊距 '+it.marginColor+' px。邊緣裁切：未檢出。極暗像素占比（黑白）：'+it.dark+'%。';}sel.addEventListener('change',()=>show(Number(sel.value)));$('#previous').addEventListener('click',()=>show(index-1));$('#next').addEventListener('click',()=>show(index+1));$('#opacity').addEventListener('input',e=>{$('#overlayOutline').style.opacity=String(Number(e.target.value)/100);$('#opacityValue').textContent=e.target.value+'%'});show(0)})();
</script></body></html>
