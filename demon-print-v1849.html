tent:center;align-items:center;gap:15px}.sheet-images img{width:100%;max-height:94%;object-fit:contain}.sheet-images figcaption{font-size:15px;color:#777}.sheet-footer{border-top:1px solid #ddd;padding-top:12px;color:#777;font-size:13px}.empty{padding:30px;text-align:center}.sheet.images-paired .sheet-images{gap:10px}.sheet.images-paired .sheet-images figure{flex:1 1 0}.sheet.images-paired .sheet-images img{max-height:85%}

</style></head><body><main class="shell"><a class="back" href="./index.html">返回小小畫家</a> <h1>鬼滅之刃・A4 角色繪圖</h1><p class="lead">本專區依你提供的 43 頁 PDF 收錄 21 組彩色／黑白配對（猗窩座包含 A、B 兩組版本）。可選擇列印單一角色或多個角色；每個角色一張 A4，保留完整圖案和紙張邊距。少數角色的彩色與黑白圖造型不同，請先預覽確認。</p>
<section class="controls" aria-label="列印設定"><strong>1. 選擇列印內容</strong><div class="options" role="radiogroup" aria-label="列印模式"><label><input type="radio" name="mode" value="outline" checked> 黑白著色圖</label><label><input type="radio" name="mode" value="color"> 彩色參考圖</label><label><input type="radio" name="mode" value="paired"> 黑白／彩色對照</label></div><strong>2. 選擇角色</strong><div class="choices"><label class="choose"><input type="checkbox" class="who" value="01" checked><img loading="lazy" src="./assets/guides-color-clean/demon01.png" alt=""><span>竈門炭治郎</span></label>
<label class="choose"><input type="checkbox" class="who" value="02" ><img loading="lazy" src="./assets/guides-color-clean/demon02.png" alt=""><span>竈門禰豆子</span></label>
<label class="choose"><input type="checkbox" class="who" value="03" ><img loading="lazy" src="./assets/guides-color-clean/demon03.png" alt=""><span>我妻善逸</span></label>

<label class="choose"><input type="checkbox" class="who" value="06" ><img loading="lazy" src="./assets/guides-color-clean/demon06.png" alt=""><span>胡蝶忍</span></label>

<label class="choose"><input type="checkbox" class="who" value="08" ><img loading="lazy" src="./assets/guides-color-clean/demon08.png" alt=""><span>宇髓天元</span></label>
<label class="choose"><input type="checkbox" class="who" value="09" ><img loading="lazy" src="./assets/guides-color-clean/demon09.png" alt=""><span>甘露寺蜜璃</span></label>

<script>
(function(){'use strict';
const names=["竈門炭治郎", "竈門禰豆子", "我妻善逸", "嘴平伊之助", "富岡義勇", "胡蝶忍", "煉獄杏壽郎", "宇髓天元", "甘露寺蜜璃", "時透無一郎", "伊黑小芭內", "不死川實彌", "悲鳴嶼行冥", "栗花落香奈乎", "鬼舞辻無慘", "猗窩座（版本 A）", "猗窩座（版本 B）", "童磨", "黑死牟", "墮姬", "妓夫太郎"];
const pages=document.getElementById('pages'),status=document.getElementById('status');
const selected=()=>Array.from(document.querySelectorAll('.who:checked')).map(el=>Number(el.value));
const mode=()=>document.querySelector('input[name="mode"]:checked').value;
const src=(n,type)=>'./assets/guides-'+type+'-clean/demon'+String(n).padStart(2,'0')+'.png'+(n===12&&type==='color'?'?art=1868':'');
function render(){const which=selected(),m=mode();pages.replaceChildren();
for(const n of which){const page=document.createElement('section');page.className='sheet'+(m==='paired'?' images-paired':'');
const title=document.createElement('header');title.className='sheet-title';const name=document.createElement('span');name.textContent=String(n).padStart(2,'0')+'　'+names[n-1];const tag=document.createElement('span');tag.className='sheet-tag';tag.textContent=m==='outline'?'黑白著色圖':m==='color'?'彩色參考圖':'黑白・彩色對照';title.append(name,tag);
const images=document.createElement('div');images.className='sheet-images';for(const t of m==='paired'?['color','outline']:[m]){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=src(n,t);img.alt=names[n-1]+' '+(t==='outline'?'黑白線稿':'彩色圖');img.addEventListener('error',()=>{status.textContent='圖片載入失敗，請確認部署包完整：'+img.src});caption.textContent=t==='outline'?'黑白線稿':'彩色參考';figure.append(img,caption);images.append(figure)}
const footer=document.createElement('footer');footer.className='sheet-footer';footer.textContent='姓名：____________________　日期：____________________';page.append(title,images,footer);pages.append(page)}
status.textContent=which.length?'已準備 '+which.length+' 頁 A4；請確認預覽無缺圖，再按「列印所選 A4」。':'請至少選擇一個角色。';document.getElementById('print').disabled=!which.length;}
for(const el of document.querySelectorAll('.who,input[name="mode"]'))el.addEventListener('change',render);
document.getElementById('all').addEventListener('click',()=>{document.querySelectorAll('.who').forEach(el=>el.checked=true);render()});document.getElementById('none').addEventListener('click',()=>{document.querySelectorAll('.who').forEach(el=>el.checked=false);render()});
document.getElementById('print').addEventListener('click',async()=>{const imgs=Array.from(pages.querySelectorAll('img'));await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})})));if(imgs.some(img=>!img.naturalWidth)){status.textContent='有圖片載入失敗，請先檢查完整部署檔案。';return}window.print()});render();
})();
</script></body></html>
