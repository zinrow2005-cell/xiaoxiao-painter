<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小畫家 V1.8.72｜動漫圖庫載入驗收</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#fff8eb;color:#473b54;max-width:1150px;margin:22px auto;padding:0 16px}header{position:sticky;top:0;background:#fff8eb;padding:12px 0;z-index:5}h1{font-size:22px}button{padding:10px 16px;background:#673f96;color:#fff;border:0;border-radius:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.card{border:1px solid #eed7be;background:#fff;border-radius:15px;padding:10px}.card.fail{border:2px solid #d44141}.card.ok{border:2px solid #61a96a}.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.trio div{text-align:center;font-size:11px}.trio img{width:100%;aspect-ratio:4/3;object-fit:contain}.status{font-weight:700;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}small{color:#756679}</style></head><body><header><h1>動漫圖庫｜53 組黑白圖／彩色圖／固定黑線載入驗收</h1><div class="toolbar"><button id="run" type="button">重新檢查全部</button><strong id="summary">尚未測試</strong></div><small>此頁必須放在 GitHub Pages 網站根目錄執行。這個檢查會逐張載入 159 個 PNG；驗收失敗會顯示具體檔名。</small></header><main id="grid" class="grid"></main><script>const series={demon:21,guoran:6,peppa:13,bluey:13};const dirs=['guides-outline-clean','guides-color-clean','guides-ink-locked'];const names=['黑白圖','彩色圖','透明黑線'];const items=Object.entries(series).flatMap(([prefix,n])=>Array.from({length:n},(_,i)=>prefix+String(i+1).padStart(2,'0')));async function check(src){return new Promise(resolve=>{const img=new Image();let done=false;const finish=(ok,why)=>{if(done)return;done=true;resolve({ok,why,img})};img.onload=()=>finish(img.naturalWidth>0,'尺寸 '+img.naturalWidth+'×'+img.naturalHeight);img.onerror=()=>finish(false,'圖片載入失敗');img.src=src+'?verify='+Date.now();setTimeout(()=>finish(false,'等待超過 12 秒'),12000)})}async function run(){const grid=document.querySelector('#grid'),summary=document.querySelector('#summary');grid.replaceChildren();summary.textContent='正在檢查…';let passed=0,fail=0;for(const id of items){const card=document.createElement('article');card.className='card';const head=document.createElement('b');head.textContent=id;const trio=document.createElement('div');trio.className='trio';const status=document.createElement('div');status.className='status';card.append(head,trio,status);grid.append(card);const parts=await Promise.all(dirs.map(async(dir,i)=>{const path='./assets/'+dir+'/'+id+'.png';const r=await check(path);const cell=document.createElement('div');const label=document.createElement('div');label.textContent=names[i];cell.append(label);if(r.ok){const thumb=document.createElement('img');thumb.src=r.img.src;cell.append(thumb)}else{const error=document.createElement('span');error.style.color='#c33';error.textContent=r.why;cell.append(error)}trio.append(cell);return {path,...r}}));const bad=parts.filter(p=>!p.ok);if(bad.length){fail++;card.classList.add('fail');status.textContent='失敗：'+bad.map(p=>p.path).join(', ')}else{passed++;card.classList.add('ok');status.textContent='✓ 全部載入正常'}summary.textContent='已檢查 '+(passed+fail)+' / '+items.length+'；正常 '+passed+'，失敗 '+fail}summary.textContent='檢查完成：正常 '+passed+' 組，失敗 '+fail+' 組'}document.querySelector('#run').onclick=run;run();</script></body></html>
