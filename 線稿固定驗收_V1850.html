<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>線稿固定功能驗收 V1.8.50</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#fff8ed;color:#3b3042;max-width:820px;margin:auto;padding:18px}main{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 30px #dcc5ae70}canvas{display:block;width:100%;max-width:650px;aspect-ratio:4/3;border:2px dashed #bd9d78;touch-action:none;background:white}button,select{font-size:1rem;padding:10px;border-radius:12px;border:1px solid #c9acc2;margin:4px}label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#status{font-weight:700}p{line-height:1.7}a{color:#73529f}</style></head><body><main><h1>固定黑白線條｜實際筆畫驗收</h1><p>選擇角色，直接在畫布上塗色；開啟固定後，黑色輪廓會疊在最上層。此測試頁使用系統中的原始黑白 PNG，不會讀取或修改孩子已儲存的作品。</p><select id="item"><option value="demon01">鬼滅之刃・竈門炭治郎</option><option value="guoran01">果燃很派・蘋果特務</option></select><label><input type="checkbox" id="lock" checked>固定黑白線條</label><label>底圖透明度 <input type="range" id="opacity" min="0" max="100" value="0"><output id="ov">0%</output></label><div><button id="clear">清除顏色（保留線條）</button><button id="export">匯出測試 PNG</button><a href="./index.html">返回小小畫家</a></div><canvas width="800" height="600" id="cv"></canvas><p id="status" role="status">載入線稿中…</p><p>驗收重點：把底圖透明度調至 0%、在黑線上用紅色亂塗；開啟固定時線條仍應清楚在最上方，關閉時可以蓋住線條。這是隔離測試頁；正式畫板仍須實際操作驗收。</p></main><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),paint=document.createElement('canvas'),px=paint.getContext('2d');paint.width=cv.width;paint.height=cv.height;const item=document.getElementById('item'),lock=document.getElementById('lock'),opacity=document.getElementById('opacity'),status=document.getElementById('status');let ink=null,ref=null,gen=0,drag=false;function img(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}async function load(){let n=++gen;status.textContent='正在載入圖片…';try{const x=await img('./assets/guides-outline-clean/'+item.value+'.png');if(n!==gen)return;ref=x;const c=document.createElement('canvas');c.width=x.naturalWidth;c.height=x.naturalHeight;const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(x,0,0);const a=q.getImageData(0,0,c.width,c.height);for(let i=0;i<a.data.length;i+=4){const d=a.data,l=255-(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722);d[i]=d[i+1]=d[i+2]=0;d[i+3]=Math.round(d[i+3]/255*Math.min(255,Math.max(0,(l-15)*1.75)))}q.putImageData(a,0,0);ink=c;px.clearRect(0,0,800,600);render();status.textContent='線稿載入成功，可以直接上色'}catch(e){status.textContent='線稿載入失敗 '+e.message}}function render(){ctx.fillStyle='#fff';ctx.fillRect(0,0,800,600);if(ref&&+opacity.value){ctx.globalAlpha=+opacity.value/100;ctx.drawImage(ref,0,0,800,600);ctx.globalAlpha=1}ctx.drawImage(paint,0,0);if(lock.checked&&ink)ctx.drawImage(ink,0,0,800,600);document.getElementById('ov').textContent=opacity.value+'%'}function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*600/r.height]}cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);px.strokeStyle='#f35655';px.lineWidth=36;px.lineCap='round';px.beginPath();px.moveTo(x,y);px.lineTo(x+.01,y+.01);px.stroke();render()};cv.onpointermove=e=>{if(!drag)return;const [x,y]=pos(e);px.lineTo(x,y);px.stroke();render()};cv.onpointerup=cv.onpointercancel=()=>{drag=false};item.onchange=load;lock.onchange=opacity.oninput=render;document.getElementById('clear').onclick=()=>{px.clearRect(0,0,800,600);render()};document.getElementById('export').onclick=()=>{render();const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='線稿固定驗收.png';a.click()};load();</script></body></html>
